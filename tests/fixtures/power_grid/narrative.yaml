project:
  language: en
input:
  type: txt
  path: narrative.txt
  extract_context: true
  generate_qa_from_text: true
  max_generated_questions: 3
task:
  domain_profile: power_grid
  modes: [choice]
  difficulty: 0.6
context:
  generate_if_missing: false
choice:
  target_option_count: 4
llm:
  model: ${OPENAI_MODEL}
verification:
  max_semantic_repairs: 2
execution:
  concurrency: 4
  llm_concurrency: 8
output:
  directory: ../../../outputs/domain/power_grid/narrative
