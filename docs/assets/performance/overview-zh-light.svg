<title id="t">7 个领域、15 项基准上的平均准确率</title>
<desc id="d">医疗分诊: DecisionForge 自训（LoRA） 72.4%, 外部 Jev 68.9%, LLM2Jev（免训练） 65.7%, AnyJev（免训练） 65.0%, Chat（未微调） 64.6%; 材料性质: DecisionForge 自训（LoRA） 79.9%, 外部 Jev 33.7%, LLM2Jev（免训练） 27.6%, AnyJev（免训练） 28.7%, Chat（未微调） 24.3%; 配电网控制: DecisionForge 自训（LoRA） 87.0%, 外部 Jev 32.8%, LLM2Jev（免训练） 11.9%, AnyJev（免训练） 16.3%, Chat（未微调） 14.7%; 停电恢复: DecisionForge 自训（LoRA） 50.5%, 外部 Jev 41.5%, LLM2Jev（免训练） 17.0%, AnyJev（免训练） 13.0%, Chat（未微调） 21.5%; 调度与储能: DecisionForge 自训（LoRA） 94.2%, 外部 Jev 73.9%, LLM2Jev（免训练） 24.7%, AnyJev（免训练） 21.0%, Chat（未微调） 29.6%; 金融文本: DecisionForge 自训（LoRA） 79.3%, 外部 Jev 75.4%, LLM2Jev（免训练） 66.5%, AnyJev（免训练） 68.6%, Chat（未微调） 65.9%; 聚变诊断: DecisionForge 自训（LoRA） 95.8%, 外部 Jev 62.8%, LLM2Jev（免训练） 63.3%, AnyJev（免训练） 62.3%, Chat（未微调） 63.3%</desc>
