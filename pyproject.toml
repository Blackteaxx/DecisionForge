[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decisionforge"
version = "0.1.0"
description = "Auditable JEV data generation and native decision model evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DecisionForge contributors" }]
dependencies = [
  "openai>=2.0,<3", "pydantic>=2.11,<3", "PyYAML>=6.0,<7",
  "python-dotenv>=1.1,<2", "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "Pillow>=12,<13", "typer>=0.15,<1", "click>=8.1,<9",
]

[project.optional-dependencies]
pdf = []
eval-data = ["pyarrow>=19"]
eval-anyjev = [
  "anyjev[hf] @ git+https://github.com/nokia-applied-research/AnyJev.git@35311c58955716cb8955ce1368a665988bc63735 ; sys_platform == 'linux' and python_version < '3.13'",
  "numpy==1.26.4; sys_platform == 'linux' and python_version < '3.13'",
  "torch==2.11.0; sys_platform == 'linux' and python_version < '3.13'",
  "transformers==5.17.0; sys_platform == 'linux' and python_version < '3.13'",
  "safetensors==0.8.0; sys_platform == 'linux' and python_version < '3.13'",
]
eval-llm2jev = [
  "llm2jev @ git+https://github.com/Yinsongxu/LLM2Jev.git@f2bdad648e7a34bfce64401fb0f7c44bc13209ae ; sys_platform == 'linux' and python_version < '3.13'",
  "sglang==0.5.12.post1; sys_platform == 'linux' and python_version < '3.13'",
  "flash-attn-4==4.0.0b9; sys_platform == 'linux' and python_version < '3.13'",
]

train-unsloth = [
  "unsloth==2026.10.3; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "unsloth_zoo==2026.10.3; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "transformers==5.17.0; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "torch==2.11.0; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "torchvision==0.26.0; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "xformers==0.0.35; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "peft==0.21.2; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "bitsandbytes==0.50.2; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "accelerate==1.13.0; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "safetensors==0.8.0; (sys_platform == 'linux' or sys_platform == 'win32') and python_version < '3.13'",
  "numpy==1.26.4; sys_platform == 'linux' and python_version < '3.13'",
  "triton-windows>=3.6,<3.7; (sys_platform == 'win32') and python_version < '3.13'",
  "numpy>=2,<3; (sys_platform == 'win32') and python_version < '3.13'",
