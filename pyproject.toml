  "laya @ git+https://github.com/NandhaKishorM/laya.git@b9fe351ce81e2d974bca2bf219c1e4030c0a05ea ; sys_platform == 'linux' and python_version < '3.13'",
  "torch==2.11.0; sys_platform == 'linux' and python_version < '3.13'",
  "transformers==5.17.0; sys_platform == 'linux' and python_version < '3.13'",
  "safetensors==0.8.0; sys_platform == 'linux' and python_version < '3.13'",
  "numpy==1.26.4; sys_platform == 'linux' and python_version < '3.13'",
  "huggingface_hub==1.33.0; sys_platform == 'linux' and python_version < '3.13'",
