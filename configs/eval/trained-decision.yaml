# Explicitly start Unsloth Studio Decision API before running this config.
benchmark: typed_decisions
benchmark_version: 1-single-question
data:
  path: ../../data/benchmarks/typed_decisions/processed/test.jsonl
  splits: [test]
model:
  adapter: jev
  base_url: http://127.0.0.1:8888
  endpoint_path: /v1/systemone
  model: default
  api_key_env: null
execution:
  concurrency: 1
  timeout: 300
  max_attempts: 1
output: ../../outputs/eval/trained-decision
