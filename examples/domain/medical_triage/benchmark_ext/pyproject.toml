[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dforge-medical-triage-benchmark"
version = "0.1.0"
description = "Task-local medical triage and patient-message priority benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["decisionforge>=0.1.0"]

[project.entry-points."decisionforge.eval.benchmarks"]
medical_decisions = "medical_triage_benchmark:benchmark"

[project.entry-points."decisionforge.eval.metrics"]
medical_accuracy = "medical_triage_benchmark:accuracy_metric"
medical_macro_f1 = "medical_triage_benchmark:macro_f1_metric"
medical_brier = "medical_triage_benchmark:brier_metric"
medical_ece = "medical_triage_benchmark:ece_metric"

[tool.hatch.build.targets.wheel]
packages = ["medical_triage_benchmark"]
